<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store Task Tracker</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #111111;
      --muted: #666666;
      --border: #dddddd;
      --done: #e8f5e9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 2rem;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 24px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .summary-card, .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    .summary-card strong {
      display: block;
      font-size: 1.7rem;
      margin-top: 4px;
    }

    .progress {
      width: 100%;
      height: 10px;
      background: #ececec;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress > div {
      height: 100%;
      width: 0%;
      background: #111;
      transition: width .2s ease;
    }

    .section {
      margin-top: 16px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 1.25rem;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 8px;
      border-top: 1px solid #eeeeee;
    }

    .task:first-of-type {
      border-top: none;
    }

    .task.done {
      background: var(--done);
    }

    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
    }

    .task label {
      flex: 1;
      cursor: pointer;
    }

    .task.done label {
      text-decoration: line-through;
      color: var(--muted);
    }

    button {
      border: 1px solid #222;
      background: white;
      color: #111;
      border-radius: 9px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background: #f0f0f0;
    }

    .footer {
      margin-top: 22px;
      color: var(--muted);
      font-size: .9rem;
      text-align: center;
    }

    @media (max-width: 600px) {
      .summary {
        grid-template-columns: 1fr;
      }
      .section-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Store Task Tracker</h1>
    <div class="subtitle">Simple proof of concept for daily and weekly operational tasks.</div>

    <div class="summary">
      <div class="summary-card">
        Daily progress
        <strong id="dailyCount">0 / 0</strong>
        <div class="progress"><div id="dailyBar"></div></div>
      </div>
      <div class="summary-card">
        Weekly progress
        <strong id="weeklyCount">0 / 0</strong>
        <div class="progress"><div id="weeklyBar"></div></div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>Daily Tasks</h2>
        <button onclick="resetGroup('daily')">Reset Daily</button>
      </div>
      <div id="dailyTasks"></div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>Weekly Tasks</h2>
        <button onclick="resetGroup('weekly')">Reset Weekly</button>
      </div>
      <div id="weeklyTasks"></div>
    </div>

    <div class="footer">
      Progress is saved on this device automatically.
    </div>
  </div>

  <script>
    const tasks = {
      daily: [
        "10% Checks",
        "Timecard Exceptions",
        "Size Compliance Refills"
      ],
      weekly: [
        "Change Order",
        "Bin Audit",
        "Worldpack Order",
        "Fire Alarm Check",
        "Mismates Processed",
        "Obsoletes Processed",
        "Negatives Investigated",
        "Post-RFID Adjustments",
        "Schedule Posted",
        "Manager Markdowns",
        "Weekly Feedback",
        "Theft Logged",
        "Retail Advantage",
        "Pyramid Weekly Safety Check",
        "Trello Updated",
        "RTWs Planned"
      ]
    };

    function storageKey(group, index) {
      return `store-task-tracker:${group}:${index}`;
    }

    function renderGroup(group) {
      const container = document.getElementById(group + "Tasks");
      container.innerHTML = "";

      tasks[group].forEach((task, index) => {
        const row = document.createElement("div");
        row.className = "task";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = `${group}-${index}`;
        checkbox.checked = localStorage.getItem(storageKey(group, index)) === "true";

        const label = document.createElement("label");
        label.htmlFor = checkbox.id;
        label.textContent = task;

        function updateRow() {
          row.classList.toggle("done", checkbox.checked);
          localStorage.setItem(storageKey(group, index), checkbox.checked);
          updateSummary(group);
        }

        checkbox.addEventListener("change", updateRow);
        row.appendChild(checkbox);
        row.appendChild(label);
        container.appendChild(row);

        row.classList.toggle("done", checkbox.checked);
      });

      updateSummary(group);
    }

    function updateSummary(group) {
      const checkboxes = [...document.querySelectorAll(`#${group}Tasks input[type="checkbox"]`)];
      const complete = checkboxes.filter(cb => cb.checked).length;
      const total = checkboxes.length;
      const percent = total ? (complete / total) * 100 : 0;

      document.getElementById(group + "Count").textContent = `${complete} / ${total}`;
      document.getElementById(group + "Bar").style.width = percent + "%";
    }

    function resetGroup(group) {
      tasks[group].forEach((_, index) => {
        localStorage.removeItem(storageKey(group, index));
      });
      renderGroup(group);
    }

    renderGroup("daily");
    renderGroup("weekly");
  </script>
</body>
</html>
